[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "allan-agent-tools"
version = "0.1.0"
description = "Local media transcription and visual references for agents, with yt-dlp, Whisper and FFmpeg."
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "Allan Monge Jiménez"}]
dependencies = [
  "yt-dlp==2026.8.19",
  "openai-whisper==20250625",
  "imageio-ffmpeg==0.6.0",
]

[project.scripts]
tools = "agent_tools.cli:main"

[tool.setuptools]
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]

[tool.setuptools.packages.find]
where = ["src"]
